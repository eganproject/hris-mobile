name: hris_tablet
description: "Aplikasi tablet absensi wajah Cahaya Optima Karya"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  camera: ^0.12.2
  google_mlkit_face_detection: ^1.0.3
  tflite_flutter: ^0.12.1
  image: ^4.13.1
  dio: ^5.11.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  crypto: ^3.0.8
  uuid: ^4.6.0
  wakelock_plus: ^1.8.2
  device_info_plus: ^13.3.0
  intl: ^0.20.3
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/img/
    - assets/sounds/
    - assets/quotes/
