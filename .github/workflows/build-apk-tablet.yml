# Build APK aplikasi TABLET absensi wajah (folder tablet/) di GitHub, terpisah
# dari aplikasi HP karyawan.
# Cara pakai: tab Actions → "Build APK Tablet" → Run workflow → (alamat HRIS
# boleh dikosongkan) → tunggu ±10 menit → unduh "absensi-tablet-apk" di bagian
# Artifacts → pasang di tablet kantor.
name: Build APK Tablet

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Alamat HRIS, tanpa / di akhir (kosongkan untuk https://cok-hris.com)'
        required: false
  push:
    branches: ['**']
    paths:
      - 'tablet/**'
      - '.github/workflows/build-apk-tablet.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: tablet
    env:
      API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL || 'https://cok-hris.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          # --split-per-abi: satu APK per jenis prosesor. APK gabungan >100 MB
          # sehingga ditolak Cloudflare (batas unggah 100 MB) saat dikirim ke HRIS;
          # APK arm64 (hampir semua tablet Android sekarang) jauh lebih kecil.
          flutter build apk --release --split-per-abi \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=APP_VERSION="$VERSION+${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: absensi-tablet-apk
          # arm64-v8a untuk hampir semua tablet; armeabi-v7a untuk tablet 32-bit lama.
          path: |
            tablet/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            tablet/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 14

      # Kirim APK ke HRIS (menu System > Aplikasi Android) supaya langsung bisa
      # diunduh dari web. Hanya di main dan bila secret HRIS_PUBLISH_TOKEN diisi
      # (= APP_RELEASE_PUBLISH_TOKEN di .env HRIS). Alamat: variabel HRIS_PUBLISH_URL
      # atau API_BASE_URL.
      - name: Kirim APK ke HRIS
        # APK dari Run workflow dengan alamat HRIS lain tidak ikut dikirim.
        if: github.ref == 'refs/heads/main' && !inputs.api_base_url
        working-directory: ${{ github.workspace }}
        env:
          HRIS_PUBLISH_TOKEN: ${{ secrets.HRIS_PUBLISH_TOKEN }}
          NOTES: ${{ github.event.head_commit.message }}
          HRIS_PUBLISH_URL: ${{ vars.HRIS_PUBLISH_URL || vars.API_BASE_URL || 'https://cok-hris.com' }}
        run: |
          if [ -z "$HRIS_PUBLISH_TOKEN" ]; then
            echo "::notice::Secret HRIS_PUBLISH_TOKEN belum diisi: APK tidak dikirim ke HRIS (unggah manual di System > Aplikasi Android)."
            exit 0
          fi
          APK=tablet/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          SIZE_MB=$(( $(stat -c %s "$APK") / 1024 / 1024 ))
          echo "Ukuran APK arm64: ${SIZE_MB} MB"
          if [ "$SIZE_MB" -ge 99 ]; then
            echo "::error::APK tablet ${SIZE_MB} MB, melebihi batas unggah Cloudflare 100 MB."
            exit 1
          fi
          curl --fail-with-body -sS --retry 3 --retry-delay 10 --max-time 600 \
            -H "Authorization: Bearer $HRIS_PUBLISH_TOKEN" -H "Accept: application/json" \
            -F app=tablet \
            -F "apk=@$APK" \
            --form-string "notes=${NOTES:0:900}" \
            "${HRIS_PUBLISH_URL%/}/api/app-releases"
