# Build APK Android di GitHub (tanpa Android Studio).
# Cara pakai: tab Actions → "Build APK" → Run workflow → isi alamat HRIS →
# tunggu ±10 menit → unduh "hris-cok-apk" di bagian Artifacts → pasang di HP.
name: Build APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Alamat HRIS (mis. https://hris.domainanda.com), tanpa / di akhir'
        required: true
  push:
    branches: ['**']
    # Aplikasi tablet punya workflow sendiri (build-apk-tablet.yml).
    paths-ignore:
      - 'tablet/**'
      - '.github/workflows/build-apk-tablet.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Jalan otomatis saat push memakai variabel repo API_BASE_URL
      # (Settings → Secrets and variables → Actions → Variables).
      API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL || 'https://cok-hris.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Simpan unduhan Gradle/Maven antar-build: lebih cepat dan tidak
          # terkena batas unduhan (HTTP 429) dari Maven Central.
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Pasang konfigurasi Firebase (notifikasi push)
        # Isi secret GOOGLE_SERVICES_JSON = isi file google-services.json dari
        # Firebase. Kalau kosong, APK tetap dibuat tanpa notifikasi push.
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json terpasang."
          else
            echo "::warning::Secret GOOGLE_SERVICES_JSON belum diisi: APK dibuat tanpa notifikasi push."
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build APK
        # Maven Central kadang menolak sementara (HTTP 429): coba sampai 3x dengan jeda.
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --release --build-number=${{ github.run_number }} --dart-define=API_BASE_URL="$API_BASE_URL"; then
              exit 0
            fi
            echo "Build gagal (percobaan $attempt), coba lagi dalam $((attempt * 60)) detik..."
            sleep $((attempt * 60))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: hris-cok-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      # Kirim APK ke HRIS (menu System > Aplikasi Android) supaya langsung bisa
      # diunduh dari web. Hanya di main dan bila secret HRIS_PUBLISH_TOKEN diisi
      # (= APP_RELEASE_PUBLISH_TOKEN di .env HRIS). Alamat: variabel HRIS_PUBLISH_URL
      # atau API_BASE_URL.
      - name: Kirim APK ke HRIS
        # APK dari Run workflow dengan alamat HRIS lain tidak ikut dikirim.
        if: github.ref == 'refs/heads/main' && !inputs.api_base_url
        working-directory: ${{ github.workspace }}
        env:
          HRIS_PUBLISH_TOKEN: ${{ secrets.HRIS_PUBLISH_TOKEN }}
          NOTES: ${{ github.event.head_commit.message }}
          HRIS_PUBLISH_URL: ${{ vars.HRIS_PUBLISH_URL || vars.API_BASE_URL || 'https://cok-hris.com' }}
        run: |
          if [ -z "$HRIS_PUBLISH_TOKEN" ]; then
            echo "::notice::Secret HRIS_PUBLISH_TOKEN belum diisi: APK tidak dikirim ke HRIS (unggah manual di System > Aplikasi Android)."
            exit 0
          fi
          curl --fail-with-body -sS --retry 3 --retry-delay 10 --max-time 600 \
            -H "Authorization: Bearer $HRIS_PUBLISH_TOKEN" -H "Accept: application/json" \
            -F app=employee \
            -F "apk=@build/app/outputs/flutter-apk/app-release.apk" \
            --form-string "notes=${NOTES:0:900}" \
            "${HRIS_PUBLISH_URL%/}/api/app-releases"
