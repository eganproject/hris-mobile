# Build APK Android di GitHub (tanpa Android Studio).
# Cara pakai: tab Actions → "Build APK" → Run workflow → isi alamat HRIS →
# tunggu ±10 menit → unduh "hris-cok-apk" di bagian Artifacts → pasang di HP.
name: Build APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Alamat HRIS (mis. https://hris.domainanda.com), tanpa / di akhir'
        required: true
  push:
    branches: ['**']
    # Aplikasi tablet punya workflow sendiri (build-apk-tablet.yml).
    paths-ignore:
      - 'tablet/**'
      - '.github/workflows/build-apk-tablet.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Jalan otomatis saat push memakai variabel repo API_BASE_URL
      # (Settings → Secrets and variables → Actions → Variables).
      API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL || 'https://cok-hris.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Simpan unduhan Gradle/Maven antar-build: lebih cepat dan tidak
          # terkena batas unduhan (HTTP 429) dari Maven Central.
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build APK
        # Maven Central kadang menolak sementara (HTTP 429): coba sampai 3x dengan jeda.
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"; then
              exit 0
            fi
            echo "Build gagal (percobaan $attempt), coba lagi dalam $((attempt * 60)) detik..."
            sleep $((attempt * 60))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: hris-cok-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
